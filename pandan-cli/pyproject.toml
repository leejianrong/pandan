[project]
name = "pandan-cli"
version = "0.22.0"
description = "The `pandan` CLI over the Pandan API (/api/v1)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pandan-client",
]

# The shared API client lives in a sibling package; depend on it by path (not a
# repo-root uv workspace) so backend/, mcp/, pandan-client/, and pandan-cli/
# each stay independently locked (KAN-21).
[tool.uv.sources]
pandan-client = { path = "../pandan-client", editable = true }

[dependency-groups]
build = [
    "pyinstaller>=6.21.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.0",
]

[project.scripts]
# `pandan` is the only console script, deliberately. A `pdn` alias was declared
# here in V40 and WITHDRAWN in KAN-442 (see ADR 0018's amendment): a
# [project.scripts] entry is generated by a packaging installer, but the release
# is a PyInstaller --onefile build producing exactly ONE executable, so the alias
# existed for `uv tool install` users and never for anyone downloading the release
# asset — the install path the docs lead with. A short name is one symlink away
# (`ln -sf ~/.local/bin/pandan ~/.local/bin/pdn`), which works on BOTH paths.
# Don't re-add it here without also solving the onefile case.
pandan = "pandan_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pandan_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
