[project]
name = "pandan-cli"
version = "0.9.0"
description = "The `pandan` CLI over the Pandan API (/api/v1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pandan-client",
]

# The shared API client lives in a sibling package; depend on it by path (not a
# repo-root uv workspace) so backend/, mcp/, pandan-client/, and pandan-cli/
# each stay independently locked (KAN-21).
[tool.uv.sources]
pandan-client = { path = "../pandan-client", editable = true }

[dependency-groups]
build = [
    "pyinstaller>=6.21.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.0",
]

[project.scripts]
# `pandan` is the canonical command; `pdn` is a keystroke-ergonomics alias on the
# same entry point, so the rebrand off `kan` costs no typing (V40, ADR 0018).
pandan = "pandan_cli.__main__:main"
pdn = "pandan_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pandan_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
