# Local full-stack: Postgres + the combined app image (built SPA served by FastAPI).
# Mirrors the single production artifact (ADR 0003). Prod uses Neon; nothing here ships.
services:
  app:
    build: .
    environment:
      # Points at the db service on the compose network.
      DATABASE_URL: postgresql+psycopg://kanban:kanban@db:5432/kanban
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      # Host port is overridable so a machine already running a Postgres on 5432 can
      # still bring this one up; `make dev` picks a free one and passes it. The
      # CONTAINER side stays 5432, so the `app` service's compose-network DSN
      # (`db:5432`) is unaffected by whatever the host publishes.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kanban_pgdata:
