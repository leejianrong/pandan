# Zensical configuration for the Pandan documentation site.
#
# Zensical (https://zensical.org) is the successor to Material for MkDocs from
# the same team. It renders a markdown tree to a static site/ directory.
#
#   uv run --project docs-tooling --frozen zensical build --strict --clean
#
# `--strict` turns build warnings (notably broken internal .md links) into a
# non-zero exit, which is what gates the docs build-check job in CI.
#
# The generated site/ directory is a build artifact — it is gitignored and CI
# rebuilds it fresh on every run.
#
# ---------------------------------------------------------------------------
# WHY docs_dir IS docs/guide AND NOT docs
#
# This site is USER documentation: how to install Pandan, use the board, drive
# it from the CLI, and wire it to an agent. The repo's planning material (the
# Shape Up chain, the ADRs, per-milestone slices, session prompts, UAT logs, the
# dogfooding log) is engineering history and is deliberately NOT published.
#
# Zensical has no `exclude_docs` / `not_in_nav` option: EVERY file under
# docs_dir is built and served, and `nav` only controls what is *listed*. So
# omitting a file from nav is not enough to keep it off the site — it just makes
# it unlisted-but-reachable, which is what the previous config did.
#
# Pointing docs_dir at the docs/guide subtree is what actually excludes the
# planning docs. It also leaves every planning file exactly where it is, so the
# ~40 `docs/adr/...` links in CLAUDE.md and the relative cross-links between
# planning docs all keep working. (FastAPI does the same thing: its site root is
# docs/en/docs/.)
#
# Consequence to remember: a link from a page here to a planning doc must be an
# absolute GitHub URL, because the planning file is outside the build tree and a
# relative .md link to it fails --strict.
# ---------------------------------------------------------------------------

[project]
site_name = "Pandan"
site_description = "Pandan is an API-first kanban board that agents and humans drive through the same API, with the same permissions."
site_author = "Jian"
site_url = "https://leejianrong.github.io/pandan/"
copyright = "Copyright &copy; 2026 Pandan"

docs_dir = "docs/guide"
site_dir = "site"

repo_url = "https://github.com/leejianrong/pandan"
repo_name = "leejianrong/pandan"

# Explicit navigation. Every published file is listed here on purpose: because
# Zensical builds everything under docs_dir, an unlisted file would still ship
# as an orphan page nobody can navigate to.
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "install.md",
    "first-steps.md",
  ] },
  { "User guide" = [
    "tutorial/index.md",
    "tutorial/boards.md",
    "tutorial/cards.md",
    "tutorial/moving-work.md",
    "tutorial/epics.md",
    "tutorial/organising.md",
    "tutorial/collaboration.md",
    "tutorial/dashboard.md",
    "tutorial/keyboard-shortcuts.md",
  ] },
  { "CLI" = [
    "cli/index.md",
    "cli/configure.md",
    "cli/reading.md",
    "cli/writing.md",
    "cli/output-formats.md",
    "cli/errors-and-exit-codes.md",
    "cli/ci.md",
  ] },
  { "Agents & MCP" = [
    "agents/index.md",
    "agents/mcp-setup.md",
    "agents/mcp-tools.md",
    "agents/workflows.md",
    "agents/token-budget.md",
  ] },
  { "Self-hosting" = [
    "self-hosting/index.md",
    "self-hosting/local.md",
    "self-hosting/configuration.md",
    "self-hosting/deploy.md",
    "self-hosting/github-autosync.md",
  ] },
  { "Reference" = [
    "reference/api.md",
    "reference/glossary.md",
  ] },
  { "About" = [
    "about/design-decisions.md",
    "about/limits.md",
    "about/releases.md",
  ] },
]

# The site's palette, logo and type are matched to the app's "Graphite (Zinc &
# Teal)" theme in assets/stylesheets/pandan.css, so the docs and the product
# read as one thing. `primary`/`accent` are "custom" so no built-in Material
# colour rule fights that stylesheet.
extra_css = ["assets/stylesheets/pandan.css"]

[project.theme]
language = "en"
logo = "assets/images/pandan-logo.svg"
favicon = "assets/images/favicon.svg"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "toc.follow",
  "content.code.copy",
  "search.suggest",
  "search.highlight",
  "search.share",
  "announce.dismiss",
]

# Two palettes with a `media` key each, so the site follows the reader's OS
# preference by default and the toggle overrides it. This mirrors the app, whose
# app.css defaults to `@media (prefers-color-scheme: dark)` with an explicit
# [data-theme] override. Without `media` the site would always open light.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Markdown extensions — the sensible-default set Zensical scaffolds, kept so
# admonitions, code highlighting, content tabs, keyboard keys and mermaid
# diagrams render. `pymdownx.keys` is load-bearing here: the keyboard-shortcuts
# page is written with ++ctrl+k++ syntax.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
