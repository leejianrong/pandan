# Dependabot dependency-update automation (dev-playbook principle 13).
# Weekly update cadence for every dependency surface in the monorepo. Minor +
# patch bumps are grouped per ecosystem into a single PR to keep the noise down;
# major bumps come as their own PRs so breaking changes are reviewed in isolation.
#
# Ecosystems: `uv` is Dependabot's native updater for uv projects (reads
# pyproject.toml + uv.lock). If a `uv` entry is ever rejected by the config
# validator, fall back to `package-ecosystem: "pip"` (still reads pyproject.toml,
# but won't refresh uv.lock's hashes) and note it here.
#
# THERE IS DELIBERATELY NO `docker` ECOSYSTEM (KAN-475). Don't add one expecting
# it to keep the Dockerfiles' base images fresh — it can only do half the job, and
# the half it can't do is the half that matters:
#
#   * `FROM python:3.12-slim` — Dependabot CAN bump this, but only if the ref is
#     pinned. Ours floats on purpose, and a floating tag already tracks upstream
#     patches, so there is nothing to bump.
#   * `COPY --from=ghcr.io/astral-sh/uv:latest` — Dependabot CANNOT bump this at
#     all: its Docker updater ignores image refs in COPY instructions
#     (dependabot/dependabot-core#5103, open since 2022; Renovate does support it).
#
# So pinning `uv` here and adding a `docker` entry to "let Dependabot handle it"
# would silently produce an UNWATCHED pin — which looks maintained and isn't. The
# MCP image instead resolves both inputs to digests at release time and records
# them as labels its release gate asserts; see the KAN-475 section of
# mcp/README.md.
#
# KAN-513 answered the same question for the repo-root Dockerfile and reached the
# same place by a different route: it keeps `node:22-slim` / `python:3.12-slim`
# floating and merely BOUNDS the uv ref to the `0.12` series (a moving tag, not a
# digest), so there is still nothing here for a `docker` ecosystem to bump. It
# deliberately does NOT copy the MCP image's build-arg/label provenance, because
# `flyctl deploy --remote-only` gives that pattern nowhere to assert the labels.
# The reasoning lives at the top of ./Dockerfile.
version: 2
updates:
  # --- Python (uv projects) ----------------------------------------------------
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/pandan-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/pandan-cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Frontend (npm) ----------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 breaks the current Svelte toolchain — svelte-check crashes at
      # startup on TS7's compiler API (was PR #88). Pin Dependabot to the 6.x line
      # (it'll track 6.x + its minors/patches) until the toolchain supports 7;
      # remove this ignore to revisit. The move to 6.x lands via a manual PR.
      - dependency-name: "typescript"
        versions: ["7.x"]

  # --- GitHub Actions used by the workflows ------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
