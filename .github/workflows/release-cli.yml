name: Release CLI binary

# Build the `pandan` CLI as a single self-contained executable (PyInstaller
# --onefile: freezes the interpreter + pandan_cli + the sibling pandan-client
# path dep + httpx into one file) so users can run it with no Python/uv
# installed (KAN-46). PyInstaller can't cross-compile, so we build natively on
# each target OS in a matrix and attach the results to the GitHub Release.
#
# SHIPPED LEGS: only `pandan-linux-x86_64` (glibc-2.28 container build, below) and
# `pandan-macos-arm64`. The Intel-mac (x86_64) leg was DROPPED (KAN-225):
# PyInstaller can't cross-compile so it must build on a native Intel runner, and
# GitHub's free Intel macOS runners are scarce/being retired, so that leg sat
# `queued` forever and the whole release run never reached a terminal state while
# the other assets attached fine. Intel-Mac users run the `pandan-macos-arm64`
# binary under Rosetta 2, install from source via `uv`, or use the MCP container
# image.
#
# LINUX GLIBC FLOOR (KAN-81): the linux leg builds inside the
# `quay.io/pypa/manylinux_2_28_x86_64` container (AlmaLinux 8 = glibc 2.28) so
# the bundled libpython requires no symbol newer than GLIBC_2.28 and the binary
# runs on Ubuntu 20.04+, Debian 11+, RHEL 8+. Building on `ubuntu-latest`
# (Ubuntu 24.04 = glibc 2.39) previously baked in a GLIBC_2.38 requirement that
# broke every older-but-supported distro; the in-job smoke test missed it
# because it ran on the same fresh image it built on. The macOS leg is
# unaffected and builds on its native runner exactly as before.
#
# THAT FIX IS NOW GUARDED BY SOMETHING THAT CAN FAIL (KAN-721). The original
# guard ran `strings` over the finished onefile, and was measured to be inert:
# it sees only PyInstaller's prebuilt bootloader, so it reported `GLIBC_2.14`
# for a definitively broken asset and for a good one alike. It has been replaced
# by `scripts/check-freeze-interpreter.sh`, which runs BEFORE the freeze and
# reads the glibc floor of the very libpython PyInstaller is about to copy in —
# the actual root cause, and a check that has been watched failing (against this
# repo's own system CPython, which needs GLIBC_2.35). The smoke test below,
# which RUNS the asset inside the glibc-2.28 container, remains the proof.
#
# TRIGGER: version tags only (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
# This never runs on a PR or a branch push — publishing is a deliberate,
# tag-gated ops action (mirrors the repo's tag convention; v0.1.0 already exists).
on:
  push:
    tags:
      - 'v*'

# Needed for softprops/action-gh-release to create/update the Release and
# upload assets with the built-in GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    # Linux builds inside a glibc-2.28 container (KAN-81); the macOS leg sets an
    # empty string, which GitHub treats as "no container" (build on the host).
    container: ${{ matrix.container }}
    strategy:
      # One red target shouldn't cancel the others — collect what we can.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # x86_64 Linux — built in a glibc-2.28 container
            container: quay.io/pypa/manylinux_2_28_x86_64
            asset: pandan-linux-x86_64
          - os: macos-14        # Apple Silicon (arm64)
            container: ''
            asset: pandan-macos-arm64
      # Windows is intentionally omitted for now — the .exe packaging + smoke
      # step differ enough to defer; add a `windows-latest` row (asset
      # `pandan-windows-x86_64.exe`) when there's demand.
    defaults:
      run:
        working-directory: pandan-cli
    steps:
      - uses: actions/checkout@v7

      # macOS legs get Python from setup-python on the host.
      - name: Set up Python 3.12
        if: matrix.container == ''
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # LINUX (KAN-81 follow-up): the manylinux-preinstalled CPython at
      # /opt/python/cp312-cp312 is built STATIC (no shared libpython), which
      # PyInstaller can't freeze ("Python was built without a shared library").
      # Install uv's managed standalone CPython instead — python-build-standalone
      # ships a *shared* libpython AND is built against old glibc (~2.17), so it
      # freezes cleanly and keeps the container's glibc-2.28 floor. Export
      # UV_PYTHON_PREFERENCE=only-managed for all *subsequent* steps (via
      # $GITHUB_ENV, linux-only) so uv picks this managed interpreter — never the
      # static system python — for both `uv sync` and `uv run pyinstaller`. Doing
      # it here (not job-level env) keeps the macOS legs completely untouched.
      - name: Install uv-managed CPython 3.12 (linux)
        if: matrix.container != ''
        run: |
          echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"
          uv python install 3.12

      # Installs the CLI, its runtime deps (httpx, the ../pandan-client path
      # dep, resolved at build time), and the `build` group (PyInstaller).
      # --python 3.12 pins the interpreter version; on linux UV_PYTHON_PREFERENCE
      # forces uv's managed (shared-libpython) build.
      - name: Install deps (incl. build group)
        run: uv sync --frozen --group build --python 3.12

      # Regression guard for KAN-81, replacing the `strings` tripwire that used to
      # sit AFTER the freeze (KAN-721). It judges the interpreter uv just resolved
      # — PyInstaller copies that interpreter's libpython into the onefile, so its
      # glibc floor IS the asset's glibc floor — which is both the root cause and
      # the only part of this that can be watched failing. Runs BEFORE the freeze,
      # so a wrong interpreter costs a second instead of a whole build. Linux only:
      # the floor is a glibc concept and the macOS leg has no equivalent.
      - name: Guard — the interpreter about to be frozen has a GLIBC <= 2.28 floor
        if: matrix.container != ''
        working-directory: .
        run: ./scripts/check-freeze-interpreter.sh pandan-cli/.venv/bin/python 28

      # Stamp the commit into the package BEFORE freezing (V50, KAN-435) so the
      # shipped binary's `--version` prints `pandan <ver> (<sha>)` instead of a
      # bare version that a stale install shares with current source. Writes the
      # git-ignored `pandan_cli/_build_stamp.py`, which `--collect-submodules
      # pandan_cli` below sweeps into the onefile; it reads $GITHUB_SHA, so no git
      # is needed inside the manylinux container. An unstamped build still works —
      # it just reports itself as a source run.
      - name: Stamp build provenance
        run: uv run --frozen python packaging/stamp_build.py

      # `--add-data` carries the packaged `pandan` skill (V48, KAN-431) into the
      # onefile, where it unpacks under sys._MEIPASS — `--collect-submodules` only
      # sweeps up importable modules, never data files. The dest path mirrors the
      # source so `context.packaged_skill_path()` finds it either way; a build
      # without it still installs the hook and just reports the skill as unbundled.
      # Both shipped legs are POSIX (linux + macos-arm64), so `:` is the separator.
      - name: Build --onefile binary
        run: >-
          uv run --frozen --group build pyinstaller --onefile
          --name "${{ matrix.asset }}"
          --collect-submodules pandan_cli
          --collect-submodules pandan_client
          --add-data "pandan_cli/skills:pandan_cli/skills"
          packaging/pyinstaller_entry.py

      # NOTE (KAN-721): a `strings dist/… | grep GLIBC_` guard used to sit here and
      # has been REMOVED, not merely moved — do not reintroduce it. `strings` sees
      # only PyInstaller's PREBUILT bootloader, whose symbols are a property of the
      # wheel upstream shipped rather than of the build host, so the check returned
      # the same `GLIBC_2.14` for a definitively broken asset as for a good one.
      # The pre-freeze interpreter guard above replaces it; the smoke test below
      # remains the authoritative proof.

      # Prove the frozen binary actually runs on the target OS before we ship it.
      # For linux this executes INSIDE the glibc-2.28 container, so a clean run
      # here is direct evidence the onefile (bootloader + extracted libpython)
      # loads under glibc 2.28 — the KAN-81 regression signal.
      - name: Smoke-test the binary
        run: |
          set -euo pipefail
          ./dist/${{ matrix.asset }} --help
          # Prove the stamp survived the freeze (V50, KAN-435): the shipped asset
          # must report this commit, never "source checkout". If this ever fails the
          # release is unshippable — a binary that can't identify itself is the bug.
          version_line=$(./dist/${{ matrix.asset }} --version)
          echo "$version_line"
          case "$version_line" in
            *"(${GITHUB_SHA:0:7})"*) echo "build provenance OK" ;;
            *) echo "::error::--version does not carry this commit (${GITHUB_SHA:0:7}): $version_line"; exit 1 ;;
          esac
          PANDAN_API_URL=https://simple-kanban-jian.fly.dev ./dist/${{ matrix.asset }} warmup

      - name: Attach binary to the Release
        uses: softprops/action-gh-release@v3
        with:
          files: pandan-cli/dist/${{ matrix.asset }}
          fail_on_unmatched_files: true
