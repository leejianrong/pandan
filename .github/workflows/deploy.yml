name: Deploy

# Auto-deploy to Fly.io on merge to main (ADR 0004). Triggered after the CI workflow
# completes, and only proceeds when BOTH hold:
#   1. CI succeeded on the main branch (a red build never ships), and
#   2. the merge actually changed something baked into the Fly image.
# The image contains only `frontend/` (built to static) + `backend/` plus the build
# config (`Dockerfile`, `fly.toml`) — see the Dockerfile COPY lines. So docs-, CI-,
# tooling-, or sibling-package-only merges (docs/, docs-tooling/, mcp/, pandan-cli/,
# pandan-client/, scripts/, *.md, .github/) skip the redeploy instead of rebuilding
# an identical image. Detection is fail-safe: if the diff can't be computed, deploy.
# Auth via the FLY_API_TOKEN repo secret.
#
# ---------------------------------------------------------------------------
# WHY THE TRIGGER IS STILL workflow_run, AND WHERE THE SECOND TRIGGER WENT
# (KAN-586 — read this before "fixing" the trigger)
# ---------------------------------------------------------------------------
# On 2026-07-31 a dependabot backend bump (PR #250 -> ef607856) merged to main
# and never deployed: prod sat on fastapi 0.140.9 while main had 0.140.13. The
# auto-merge workflow arms GitHub's native auto-merge with the built-in
# GITHUB_TOKEN, GitHub attributes the merge to github-actions[bot]
# (`gh pr view 250 --json mergedBy` -> app/github-actions), and GitHub creates NO
# workflow runs for events triggered by GITHUB_TOKEN. No CI run on main means no
# `workflow_run` event, so Deploy never fired.
#
# The obvious repair is "give Deploy a push trigger on main too". IT DOES NOT
# WORK, and the evidence is in this repository's own run history. The recursion
# protection suppresses the PUSH EVENT ITSELF, not just CI's subscription to it:
#
#   gh api "repos/leejianrong/pandan/actions/runs?branch=main&event=push"
#     -> every other merge to main has TWO push runs (CI + Docs)
#   gh api ".../actions/runs?head_sha=ef607856bc19eecdecabf39ab0b024ab97ffd304"
#     -> total_count 2, both `Deploy`, both `event: workflow_run`, both skipped
#        (they were fired by CI runs on other refs and correctly gated out).
#        ZERO push-event runs, from any workflow.
#
# ci.yml already has `push: branches: [main]` and did not run. A third
# push-triggered workflow would not have run either. For the same reason the
# "have the auto-merge workflow dispatch the deploy after merging" option is dead
# twice over: that workflow is `on: pull_request` (opened/synchronize/reopened),
# so it arms `--auto` and exits long before the merge happens and never observes
# it — and the post-merge `pull_request: closed` event it would need is
# suppressed by the very same rule.
#
# So the only mechanism that restores the chain is to stop merging with
# GITHUB_TOKEN: see the AUTOMERGE_TOKEN block in dependabot-auto-merge.yml. This
# file's trigger is therefore UNCHANGED on purpose. A push trigger here would add
# a deploy path that fires before CI has validated the merge commit — and branch
# protection on this repo has `strict: false`
# (`gh api repos/leejianrong/pandan/branches/main/protection`), so a PR's green
# checks are NOT evidence about the merge commit, which is precisely what CI on
# main provides.
#
# What this file gains instead is a WATCHER (the `drift` job below), because the
# failure class here is "deploy silently does not happen" and every structural
# signal said fine. It is trigger-independent: it asks what production last
# actually deployed and compares it to main, so it catches this route, the
# cancelled-CI route ci.yml's concurrency key now closes, a genuinely red CI run
# on main (also a silent non-deploy, and not otherwise reported), and whatever
# the next route turns out to be.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Watcher only — see the `drift` job. Every deploying job below is hard-gated
  # on `github.event_name == 'workflow_run'`, so these triggers cannot ship code.
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

# The set of paths baked into the Fly image, defined ONCE and consumed by both
# the deploy gate and the drift watcher. Two copies would let the watcher go
# blind in exactly the place the gate is blind. (KAN-584 checked this list against
# the Dockerfile's COPY set — it matches, verified by building from a context
# containing only those paths — and mcp/tests/test_image_build_inputs.py now reads
# IMAGE_PATHS live out of this file and asserts it keeps matching.)
env:
  IMAGE_PATHS: '^(backend/|frontend/|Dockerfile|fly\.toml|\.dockerignore)'

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    # Gate: this is a CI completion event AND CI passed AND it was main that ran.
    # The event_name test is redundant today (`github.event.workflow_run` is null
    # on schedule/dispatch, so the other two are already false) and is here as a
    # belt-and-braces guard a reviewer can check by eye: the watcher triggers
    # above must never be able to reach a `flyctl deploy`.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # full history so we can diff the merge commit against its parent
      - id: filter
        name: Did anything in the Fly image change?
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Files this commit changed vs its first parent (the prior main); for a PR
          # merge commit that is exactly the PR's net diff. If there's no parent
          # (or any error), fail safe and deploy.
          if ! base=$(git rev-parse --verify "${SHA}^1" 2>/dev/null); then
            echo "No first parent for ${SHA} — deploying to be safe."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$SHA")
          echo "Changed files:"
          echo "$changed"
          # Paths that actually end up in the deployed image / affect the build.
          if echo "$changed" | grep -qE "$IMAGE_PATHS"; then
            echo "Image-affecting paths changed → deploy."
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image-affecting paths changed → skip deploy."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Fly.io
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI validated, not whatever is latest.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # --build-arg GIT_REVISION bakes the shipping commit into the image
        # (Dockerfile ARG -> ENV), and the app re-publishes it on
        # GET /api/health/version. That is what lets the `drift` job below
        # OBSERVE production instead of inferring it from this workflow's own
        # run history (KAN-595). It must be the SAME sha the checkout above
        # used, or the endpoint would confidently report the wrong commit.
        run: flyctl deploy --remote-only --build-arg GIT_REVISION="$GIT_REVISION"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GIT_REVISION: ${{ github.event.workflow_run.head_sha }}

  # ---------------------------------------------------------------------------
  # The watcher (KAN-586). Answers the one question no structural signal answers:
  # is production actually running main's app code?
  #
  # "Guard with no watcher" has hit this project six times by six different
  # routes, and KAN-586 is the sixth. This job is the watcher for the deploy
  # contract itself, so state plainly what runs IT: the
  # `schedule:` cron above (and `workflow_dispatch` for on-demand). It does NOT
  # run on `workflow_run`, so it never doubles a real deploy run. Two known ways
  # it can rot: GitHub disables `schedule:` triggers after 60 days with no repo
  # activity, and a scheduled-run failure notifies only the last person to touch
  # the cron. Neither applies to a repo merging daily, but both are real.
  #
  # It deliberately does not ask Fly. `flyctl deploy --remote-only` tags the image
  # `deployment-<id>`, and Fly's API reports the image ref/digest but not its
  # labels, so Fly cannot say which commit it is running.
  #
  # ---------------------------------------------------------------------------
  # KAN-595: THE WATCHER NOW OBSERVES PRODUCTION INSTEAD OF INFERRING IT
  # ---------------------------------------------------------------------------
  # Until KAN-595 this job answered the question by walking THIS WORKFLOW'S OWN
  # history: the head SHA of the most recent Deploy run whose `Deploy to Fly.io`
  # job actually SUCCEEDED (not skipped — a docs-only Deploy run reports
  # workflow-level `success` with that job skipped, which is the trap). That is
  # exact about what GitHub last TRIED to ship, and it worked. But it is an
  # INFERENCE about production, and every way it can be wrong is silent: a
  # Fly-side rollback, a machine that never restarted onto the new image, or a
  # `flyctl deploy` from a laptop that Actions never saw at all.
  #
  # The app image now bakes its own revision in (Dockerfile `ARG GIT_REVISION` ->
  # `ENV`, passed by the deploy step above) and republishes it on
  # `GET /api/health/version`. So the watcher curls production and asks it
  # directly. No GitHub API in the happy path, no registry auth, and it catches
  # the three cases above that the history walk structurally cannot.
  #
  # The history walk is KEPT, demoted to a DIAGNOSTIC: it runs only on a failure
  # path, to say whether GitHub even tried. "Production is behind and no deploy
  # ran" (a merge that never triggered a deploy — the KAN-586 case) and
  # "production is behind although a deploy ran and succeeded" (rollback, or a
  # machine still on the old image) are different incidents with different fixes,
  # and the difference is worth one API call at the moment you are already red.
  #
  # WHAT THIS STILL DOES NOT PROVE, stated plainly so nobody overclaims from it:
  # the endpoint reports the revision the BUILD ARG named. A wrongly-passed
  # --build-arg would be believed. That is a strictly smaller gap than the
  # inference it replaces, not a closed one.
  drift:
    name: Deploy drift watcher
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # need history to test ancestry + diff against an old SHA

      - name: Is production running main's app code?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PROD_VERSION_URL: ${{ vars.PROD_VERSION_URL || 'https://simple-kanban-jian.fly.dev/api/health/version' }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          echo "main is at: $main_sha"

          # --- The old inference, kept as a DIAGNOSTIC (KAN-595) --------------
          # Walk Deploy runs newest-first for the first one that really deployed.
          # This no longer decides anything; it only enriches a failure message
          # with "…and GitHub did / did not think it shipped", which is what
          # separates "the merge never triggered a deploy" from "the deploy ran
          # and production is still on the old image".
          #
          # `event=workflow_run` is LOAD-BEARING, not a tidy-up. This watcher is
          # itself a job in deploy.yml, so every one of its own scheduled runs is a
          # `Deploy` run — eight a day on the 3-hourly cron, none of which can ever
          # contain a `Deploy to Fly.io` job (the deploying jobs are hard-gated on
          # `event_name == 'workflow_run'`). Unfiltered, the watcher's own runs
          # evict the real deploys from any fixed window: within ~5 days 39 of the
          # last 45 Deploy runs were this cron, the newest genuine deploy sat 46
          # back, and the watcher failed every 3 hours with "No Deploy run in the
          # last 40 has a successful 'Deploy to Fly.io' job" while production was
          # in fact exactly on main's tip. A watcher that cries wolf on its own
          # heartbeat is worse than no watcher — it trains you to ignore the alarm
          # that matters. Filtering to `workflow_run` makes the window mean what it
          # says: the last 40 times a merge to main could have shipped.
          last_actions_deploy() {
            local run_id shipped run_ids
            # A failed API call must not masquerade as "nothing has deployed" —
            # that is a different incident and would point the reader at the
            # wrong one.
            run_ids=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?per_page=40&event=workflow_run" \
                        --jq '.workflow_runs[].id') || {
              echo "unavailable (GitHub API call failed)"
              return 0
            }
            for run_id in $run_ids; do
              shipped=$(gh api "repos/$REPO/actions/runs/$run_id/jobs" \
                          --jq '[.jobs[] | select(.name == "Deploy to Fly.io" and .conclusion == "success")] | length')
              if [ "$shipped" != "0" ]; then
                gh api "repos/$REPO/actions/runs/$run_id" --jq '.head_sha'
                return 0
              fi
            done
            echo "no successful 'Deploy to Fly.io' job in the last 40 workflow_run Deploy runs"
          }
          diagnose() { last_actions_deploy 2>/dev/null || echo "unavailable (GitHub API call failed)"; }

          # --- Observe production directly (KAN-595) -------------------------
          # Retries because fly.toml sets min_machines_running = 0: the first hit
          # may be waking a cold machine, and Fly's proxy answers 502/503 while it
          # boots — hence --retry-all-errors, not just --retry-connrefused.
          echo "Asking production: $PROD_VERSION_URL"
          if ! body=$(curl -fsS --max-time 30 --retry 4 --retry-delay 5 \
                        --retry-connrefused --retry-all-errors "$PROD_VERSION_URL" 2>&1); then
            echo "::error title=Deploy drift watcher could not observe production::GET $PROD_VERSION_URL failed after retries: ${body//$'\n'/ }. This job asserts what production is RUNNING, so it cannot pass without an answer — a watcher that shrugs when it cannot see is the failure mode this repo keeps rediscovering. For context, GitHub's last successful deploy was: $(diagnose)."
            exit 1
          fi

          # Parse strictly, and do NOT trust the status code. backend/app/main.py
          # mounts the SPA catch-all as GET /{full_path:path} with no /api
          # exclusion, so an image that predates this endpoint answers
          # /api/health/version with 200 and index.html. `curl -f` is happy; only
          # the SHAPE of the body distinguishes "old image" from "real answer".
          revision=$(printf '%s' "$body" | jq -r '.revision // empty' 2>/dev/null || true)
          if ! printf '%s' "$revision" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error title=Production did not report a git revision::$PROD_VERSION_URL answered without a usable 40-char revision (got '${revision:-<none>}'). Expected on exactly one occasion: the very first run after KAN-595 merges but before its deploy lands, because the image running then predates the endpoint and the SPA catch-all serves index.html for it. Anything later means the endpoint, the Dockerfile ARG, or the deploy's --build-arg regressed. Failing rather than falling back, on purpose: the fallback is the inference this card replaced. GitHub's last successful deploy was: $(diagnose)."
            exit 1
          fi
          echo "Production reports revision: $revision"

          if ! git cat-file -e "${revision}^{commit}" 2>/dev/null; then
            echo "::error title=Production reports an unknown commit::Production says it is running $revision, which this repository does not contain. Either the deploy passed a bogus --build-arg, or main's history was rewritten. GitHub's last successful deploy was: $(diagnose)."
            exit 1
          fi

          if [ "$revision" = "$main_sha" ]; then
            echo "Production is running main's tip. In step."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$revision" "$main_sha"; then
            echo "::error title=Production is not on main::Production is running $revision, which is not an ancestor of main ($main_sha) — production is running something main does not contain. GitHub's last successful deploy was: $(diagnose)."
            exit 1
          fi

          changed=$(git diff --name-only "$revision" "$main_sha")
          echo "Changed since the commit production is running:"
          echo "$changed"

          if echo "$changed" | grep -qE "$IMAGE_PATHS"; then
            echo "::error title=DEPLOY DRIFT::main contains image-affecting changes that production is NOT running. Production is on $revision, main is $main_sha. GitHub's last successful deploy was: $(diagnose) — if that equals main, the deploy ran and production did not take it (rollback, or a machine that never restarted); if it is behind main, something merged without deploying (a GITHUB_TOKEN merge fires no runs at all; see KAN-586). This self-heals on the next app-code merge, which is what makes it invisible."
            exit 1
          fi

          echo "Only non-image paths changed since production's commit — production is current."
