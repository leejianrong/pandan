name: Dependabot auto-merge

# ============================================================================
# DISABLED 2026-08-01 — this workflow does not run. Owner decision, KAN-586.
# ============================================================================
# Turned off with `gh workflow disable "Dependabot auto-merge"`; its state reads
# `disabled_manually`. **That state lives in GitHub, not in this file** — nothing
# in the repo can observe or assert it, which is exactly why this banner exists.
# If you are reading this file to find out whether it runs, the answer is no;
# confirm with `gh workflow list --all | grep auto-merge`.
#
# WHY. Arming auto-merge with the built-in GITHUB_TOKEN makes GitHub attribute
# the merge to github-actions[bot], and GitHub creates NO workflow runs for
# events triggered by GITHUB_TOKEN. No CI run on main means no `workflow_run`
# event, so deploy.yml never fires: PR #250's fastapi bump merged green and sat
# undeployed until an unrelated merge carried it forward days later. The full
# chain, and why a push trigger on deploy.yml cannot fix it either, is in the
# header of deploy.yml.
#
# The repair needs a merge performed by something OTHER than GITHUB_TOKEN, i.e.
# a stored credential (`AUTOMERGE_TOKEN`, wired below). The owner chose not to
# store one: the only token to hand was scoped to every repository on the
# account, and a fine-grained PAT is maintenance for an automation whose entire
# value is saving a click. Dependabot PRs are now merged BY HAND — a human merge
# fires a normal push event, so CI runs and Deploy fires, which is the whole
# point. Note also that this workflow is `on: pull_request` from Dependabot, so
# it would need the token in the **Dependabot** secret store, not the Actions
# one; that store is empty, so setting an ordinary Actions secret would silently
# have changed nothing.
#
# DEPENDABOT ITSELF IS UNTOUCHED and should stay that way — it is the security-
# patch feed, and it surfaced both the fastapi patch above and the `mcp` 2.0
# major that became KAN-585. A dependabot PR sitting open is inert; only the
# unattended GITHUB_TOKEN merge was ever the problem.
#
# TO RE-ENABLE: add a fine-grained PAT (this repo only; Contents + Pull requests
# read/write) as the `AUTOMERGE_TOKEN` **Dependabot** secret, then
# `gh workflow enable "Dependabot auto-merge"`. Delete this banner when you do.
# The machinery below is left intact and its guards
# (`mcp/tests/test_deploy_gates.py` §6) still assert the token design, so a
# re-enable cannot quietly go back to a bare GITHUB_TOKEN.
#
# A middle option was considered and not taken: gate auto-merge on whether the
# PR is image-affecting (deploy.yml's IMAGE_PATHS), auto-merging only the
# ecosystems that never deploy. Cheap and token-free, but it keeps a second
# deploy-relevant code path alive to save a handful of clicks a week.
# ============================================================================

# Auto-merge low-risk Dependabot PRs so the routine version churn never piles up in
# the review queue (this is a 6-ecosystem monorepo — a single tool bump becomes
# several PRs). Only **patch** and **minor** updates auto-merge; **major** bumps
# (incl. dev-tool majors like a TypeScript major that can surface new type errors)
# arrive as their own PRs per .github/dependabot.yml and are left for human review.
#
# Two flavours of Dependabot PR, handled separately (see the "Decide" step):
#   1. version updates (a pinned dep / lockfile) — fetch-metadata reports a clean
#      `update-type` (semver-patch/minor/major); we gate on that.
#   2. version-*requirement* updates (a `>=` range in pyproject, common for the uv
#      projects) — fetch-metadata reports `update-type: null` and NO versions, so we
#      fall back to the PR title ("... requirement from <A> to <B> ...") and compare
#      the MAJOR components. Fail-safe: auto-merge only when both majors parse AND
#      are equal; anything else (differing majors like fastapi-users 14->15, or an
#      unparseable title) is left for review.
#
# Uses GitHub's *native* auto-merge (`gh pr merge --auto`), so nothing merges until
# branch protection's required CI checks pass — the bot only arms the merge, CI
# still gates it. Requires the repo setting "Allow auto-merge" (enabled).
on: pull_request

# Elevated perms are scoped to this workflow; GitHub grants them to the
# Dependabot-triggered run because they're declared here.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this is an auto-mergeable (patch/minor) update
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          automerge=false
          detail=""
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              automerge=true
              detail="version update ($UPDATE_TYPE)"
              ;;
            version-update:semver-major)
              detail="major version update — manual"
              ;;
            *)
              # update-type empty/null → a requirement (range) bump. fetch-metadata
              # gives no versions here, so parse them out of the PR title and compare
              # majors. Only proceed when it clearly matches "... requirement from
              # <A> to <B> ...".
              if printf '%s' "$PR_TITLE" | grep -qiE 'requirement from .+ to '; then
                rest="${PR_TITLE#*requirement from }"    # "<A> to <B> in <dir>"
                from_ver="${rest%% to *}"                # "<A>"
                to_part="${rest#* to }"                  # "<B> in <dir>"
                to_ver="${to_part%% *}"                  # "<B>"
                from_major="$(printf '%s' "$from_ver" | grep -oE '[0-9]+' | head -1 || true)"
                to_major="$(printf '%s' "$to_ver" | grep -oE '[0-9]+' | head -1 || true)"
                if [ -n "$from_major" ] && [ -n "$to_major" ] && [ "$from_major" = "$to_major" ]; then
                  automerge=true
                  detail="requirement bump within major $from_major ($from_ver -> $to_ver)"
                else
                  detail="requirement bump crosses/unknown major ($from_ver -> $to_ver) — manual"
                fi
              else
                detail="no update-type and not a parseable requirement bump — manual"
              fi
              ;;
          esac
          echo "automerge=$automerge" >> "$GITHUB_OUTPUT"
          echo "Decision: $detail => automerge=$automerge"

      # --- Which token arms the merge, and why it is not GITHUB_TOKEN ----------
      # KAN-586. `gh pr merge --auto` arms GitHub's NATIVE auto-merge, and GitHub
      # attributes the eventual merge to whoever armed it. Armed with the built-in
      # GITHUB_TOKEN, the merge lands as github-actions[bot] — and GitHub creates
      # no workflow runs for events triggered by GITHUB_TOKEN (documented
      # recursion protection). The merge push to main therefore fires NO CI run,
      # deploy.yml triggers on `workflow_run: [CI] completed`, and the deploy
      # silently never happens.
      #
      # Verified end to end on PR #250 (fastapi 0.140.9 -> 0.140.13, merged
      # ef607856 at 18:55:06 on 2026-07-31): `mergedBy` was app/github-actions,
      # the API reports ZERO push-event runs at that SHA while every other merge
      # to main has two (CI + Docs), and production was still serving fastapi
      # 0.140.9 the next day. So the one category of dependabot PR that MUST
      # deploy — backend/ and frontend/ bumps, i.e. the security patches this
      # automation exists to deliver — was precisely the category that did not.
      # It self-heals on the next app-code merge, leaves nothing red, and notifies
      # nobody.
      #
      # The alternatives, and why they lose (deploy.yml's header has the full
      # evidence): a push trigger on Deploy cannot work, because the recursion
      # protection suppresses the push EVENT, not one workflow's subscription to
      # it; and having this workflow dispatch the deploy cannot work, because it
      # runs `on: pull_request` (opened/synchronize/reopened), arms `--auto` and
      # exits minutes before the merge, never observing it — and the
      # `pull_request: closed` event it would need is suppressed by the same rule.
      # Only not-using-GITHUB_TOKEN restores the normal chain.
      #
      # AUTOMERGE_TOKEN should be a FINE-GRAINED PAT scoped to this repository
      # with Contents: read/write + Pull requests: read/write (a GitHub App
      # installation token via actions/create-github-app-token is the upgrade —
      # short-lived, no expiry cliff). It does NOT weaken the gate: `--auto` still
      # waits for branch protection's required checks, the bot only arms it.
      #
      # The fallback to GITHUB_TOKEN is deliberate: an unset secret leaves
      # behaviour exactly as it is today rather than breaking auto-merge outright,
      # and the warning below plus deploy.yml's `drift` watcher make the degraded
      # state visible instead of silent. An EXPIRED token does not fall back (it
      # is non-empty), so it fails the step red — which is the loud failure you
      # want. Do not "simplify" this back to a bare GITHUB_TOKEN; it is pinned by
      # mcp/tests/test_deploy_gates.py.
      - name: Arm auto-merge
        if: ${{ steps.decide.outputs.automerge == 'true' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AUTOMERGE_TOKEN}" ]; then
            echo "::warning title=This merge will not trigger CI or Deploy::AUTOMERGE_TOKEN is unset, so the merge falls back to GITHUB_TOKEN and lands as github-actions[bot]. GitHub creates no workflow runs for GITHUB_TOKEN-triggered events, so no CI run on main and therefore no Deploy. A backend/ or frontend/ bump merged this way is NOT in production until some later app-code merge carries it forward (KAN-586). Add a fine-grained PAT as the AUTOMERGE_TOKEN repository secret."
          else
            echo "Arming auto-merge with AUTOMERGE_TOKEN — the merge will trigger CI on main, and Deploy after it."
          fi
          gh pr merge --auto --merge "$PR_URL"
