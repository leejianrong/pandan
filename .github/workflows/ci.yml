name: CI

# Validate every PR and every push to main (ADR 0004). Ten independent jobs:
# lint, fast unit tests (no Docker), integration tests (real Postgres via
# testcontainers), the frontend build/type-check, Playwright e2e smoke tests
# (real Postgres via a service container), the shared pandan-client's lint +
# tests, the MCP server's lint + tests, the `kan` CLI's lint + tests (the
# middle three all mocked httpx, no DB), a container `image` build of ./Dockerfile
# and mcp/Dockerfile (KAN-584), and a supply-chain `security` scan (secret scan
# over history + dependency vulnerability audit). The Deploy workflow only runs
# after this whole workflow succeeds on main.
#
# CI path filtering (KAN-37): a leading `changes` job computes which areas of
# the repo a PR touched; each of the nine gated jobs then guards its *heavy
# steps* on the relevant output. On a docs-only change (nothing matching any
# filter — docs/, .claude/, root *.md) every job still RUNS and REPORTS SUCCESS
# under its existing `name:`, but skips the expensive install/test work in
# seconds. Note the filters are no longer a clean "one area per directory": the
# `mcp` filter also watches scripts/git-hooks/, .github/workflows/ and the root
# Dockerfile, because tests guarding those live under mcp/tests/ (see there).
#
# This is a deliberately GATE-SAFE design: branch protection lists several of
# these `name:`s as *required* status checks, and a required check that never
# reports (the classic trap of a job-level `if:` skip, or a top-level
# `paths:`/`paths-ignore:` filter on the trigger) leaves every PR stuck at
# "Expected" and un-mergeable. Because each job still completes, each required
# name still reports success — the gate is never left hanging. A more
# aggressive variant that also cuts the *runner count* (job-level `if:` skips
# behind a single `CI Success` aggregator made the sole required check) would
# require a branch-protection settings change by a maintainer and is left as a
# documented follow-up, not done here.
on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded in-progress run when a new commit is pushed to the same
# ref (dev-playbook principle 6). Without this, pushing twice to a PR runs both
# to completion and wastes runners on the stale commit. (Deploy has its own
# concurrency group in deploy.yml — don't add one there.)
#
# PUSHES TO MAIN ARE DELIBERATELY EXEMPT (KAN-586). `github.ref` is
# `refs/heads/main` for EVERY merge, so a ref-only key put every merge to main in
# one group and each merge cancelled the previous merge's CI. That is not a
# saving. Cancelling a PR-branch run discards evidence about a commit nobody will
# ever ship; cancelling a main run discards the only CI evidence that a MERGE
# COMMIT is good — and because deploy.yml triggers on `workflow_run: [CI]
# completed` and gates on `conclusion == 'success'`, it ALSO silently suppresses
# that merge's deploy. Verified twice on 2026-07-31: runs 30656741056 (@9a1c825c,
# the KAN-518 merge, killed 74s later by the KAN-513 merge) and 30631718051
# (@1992dd76) both show `conclusion: cancelled`. Both happened to be docs/mcp, so
# nothing that should have shipped didn't — which is exactly why nobody noticed.
#
# The fix appends `github.sha` on main, giving every merge commit its own group,
# so main runs neither cancel nor queue behind one another. It is deliberately
# NOT `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}`: that only
# QUEUES, and GitHub keeps at most one *pending* run per group and cancels the
# older pending one when a third arrives — which reintroduces the identical bug
# during exactly the situation that triggered it (six merges to main in 33
# minutes on 2026-07-31).
#
# Accepted trade-off: two app-code merges can now have CI in flight at once, so
# if the older finishes LAST its Deploy runs last and prod briefly lands on the
# older SHA (deploy.yml checks out `workflow_run.head_sha`). Two app-code merges
# both run the full suite, so durations are comparable and completion order
# almost always matches merge order, and the next merge heals it regardless.
# Losing the CI evidence — and the deploy — outright was the worse failure.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  cancel-in-progress: true

jobs:
  # Lightweight gate: classify which areas of the repo changed. Every other
  # job `needs:` this and reads its outputs to decide whether to do real work.
  # Kept minimal and dependency-light so it is extremely unlikely to fail (a
  # failure here would skip the dependents and could stall a required check).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      client: ${{ steps.filter.outputs.client }}
      cli: ${{ steps.filter.outputs.cli }}
      cli_code: ${{ steps.filter.outputs.cli_code }}
      cli_version: ${{ steps.filter.outputs.cli_version }}
      image: ${{ steps.filter.outputs.image }}
      mcp_image: ${{ steps.filter.outputs.mcp_image }}
    steps:
      # Needed so paths-filter can diff on `push` events (on `pull_request` it
      # uses the GitHub API and doesn't strictly need the checkout).
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # EVERY FILTER HERE MUST HAVE A CONSUMER. There is deliberately no
          # `app:` union filter (KAN-596): one existed from KAN-37 until now,
          # declared as a job output and read by NOTHING — `needs.changes.
          # outputs.app` never appeared in this file in its entire history. It
          # was not merely unused, it MISLED: KAN-584's card cited it as "the app
          # union" that should have matched `Dockerfile`, framing the gap as a
          # filter missing an entry, when the truth was that the filter could
          # never have caught anything because no job was gated on it. A
          # classifier with no consumer reads as coverage and provides none —
          # the same family as this milestone's recurring "guard with no
          # watcher", one level out. deploy.yml has its own, separate `app`
          # filter which IS consumed (by its `deploy` job's `if:`); job outputs
          # are not visible across workflows, so the two never interacted.
          # Pinned by mcp/tests/test_ci_filter_outputs.py.
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            mcp:
              - 'mcp/**'
              # The pre-push hook's regression tests live in mcp/tests
              # (test_prepush_hook.py — the `mcp` job needs no DB/Docker/network,
              # the same reason test_image_provenance_gate.py lives there). The
              # hook itself is NOT under mcp/, so without this line a hook-only
              # PR would skip the very tests that guard it — a guard with no
              # watcher, which is how KAN-452's release gate nearly rotted.
              # KAN-484 shipped those tests and reported this hole from outside
              # its fence.
              - 'scripts/git-hooks/**'
              # And again (KAN-721): mcp/tests/test_freeze_interpreter_guard.py
              # exercises scripts/check-freeze-interpreter.sh, the release's
              # pre-freeze glibc guard. It lives outside mcp/ for the same reason
              # the hook does, and this is the same hole — doubly worth closing
              # here, because the guard it replaced was itself inert and nothing
              # noticed for months.
              - 'scripts/check-freeze-interpreter.sh'
              # And once more (KAN-586): mcp/tests/test_deploy_gates.py pins the
              # CI/Deploy/auto-merge invariants that keep a merge to main actually
              # reaching production — the concurrency key just above, deploy.yml's
              # trigger gate, and the auto-merge token. Those files are under
              # .github/workflows/, not mcp/, so without this line the one PR
              # shape that can break them (a workflow-only PR) would be the one
              # shape that never runs the tests guarding them.
              - '.github/workflows/**'
              # And once more (KAN-584): mcp/tests/test_image_build_inputs.py
              # asserts that every repo path the ROOT Dockerfile COPYs is covered
              # by deploy.yml's IMAGE_PATHS — i.e. that the deploy gate and the
              # drift watcher can still see a change to what the image contains.
              # Its two inputs are the root Dockerfile and deploy.yml. The latter
              # is covered by the line above; without these two, the ONE change
              # shape that can break the invariant (a Dockerfile-only PR, which is
              # also the shape that produced KAN-584) would never run the test.
              # That is the KAN-502 shape: a test whose input lives outside its
              # own filter.
              - 'Dockerfile'
              - '.dockerignore'
            client:
              - 'pandan-client/**'
            cli:
              - 'pandan-cli/**'
              # pandan-cli/tests/test_parity.py reads the MCP tool names out of
              # server.py AS TEXT (it must not import pandan_mcp — that would
              # invert ADR 0005's adapter independence), and asserts parity in
              # BOTH directions. So the CLI suite has a real input outside
              # pandan-cli/: adding an MCP tool without a CLI route must fail
              # here, and without this line an mcp-only PR would never run it.
              # mcp/tests/test_schema.py's 49-tool freeze catches the same case
              # first, so the two compose — but a guard whose CI does not run it
              # is the KAN-452 / KAN-484 shape, and this closes it directly.
              - 'mcp/pandan_mcp/server.py'
            # Bump-on-fix guard (V50, KAN-435): `cli_code` is a change to CLI
            # BEHAVIOUR, `cli_version` is a change to a version declaration. The
            # `cli` job fails when the first is true and the second is not — a
            # user-visible fix that never bumps the version ships a binary
            # indistinguishable from source, which caused two false bug reports.
            # Note a pure bump touches __init__.py, so it satisfies both.
            cli_code:
              - 'pandan-cli/pandan_cli/**'
            cli_version:
              - 'pandan-cli/pyproject.toml'
              - 'pandan-cli/pandan_cli/__init__.py'
            # --- container image build inputs (KAN-584) -----------------------
            # Until now NOTHING in this file mentioned `Dockerfile`, so a
            # Dockerfile-only PR matched no filter, every job reported success
            # having skipped its heavy steps in 3-5 seconds, and deploy.yml
            # (whose filter DOES match `Dockerfile`) then shipped it. The only
            # validation was the Fly remote build, after the merge. PR #248 is
            # the worked example.
            #
            # These two filters are deliberately NARROWER than `backend/**` +
            # `frontend/**`. What they cover is the BUILD RECIPE and the
            # DEPENDENCY MANIFESTS — the inputs that can break an image build
            # while every other job stays green, which is exactly the dependabot
            # bump shape. Ordinary source edits are excluded on purpose: the
            # image runs no compile step over app source (it is `uv sync` +
            # `npm run build` + COPY), and `npm run build` is already run by the
            # `frontend` job and `uv sync --frozen` by lint/unit/integration. See
            # the WHAT THIS DOES NOT COVER note on the `image` job below.
            image:
              - 'Dockerfile'
              - '.dockerignore'
              # Not a build input at all — `docker build` never reads it. It is
              # here because a fly.toml change always deploys and is otherwise
              # validated by nothing whatsoever, so at minimum it should carry a
              # proof that the image it deploys still builds. Rare enough that
              # the cost is noise.
              - 'fly.toml'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            # mcp/Dockerfile has the SAME hole, checked rather than assumed:
            # publish-mcp-image.yml is the only workflow in this repo that builds
            # any image, and it triggers on `v*` tags only (KAN-452's finding), so
            # an mcp/Dockerfile change is unvalidated until a release. The `mcp`
            # job runs on it but only lints and pytests — it never builds.
            mcp_image:
              - 'mcp/Dockerfile'
              - '.dockerignore'   # the build context is the REPO ROOT
              - 'mcp/pyproject.toml'
              - 'mcp/uv.lock'
              # The image bakes the sibling path dep, so its manifests are build
              # inputs too (mcp/Dockerfile COPYs pandan-client/).
              - 'pandan-client/pyproject.toml'
              - 'pandan-client/uv.lock'

  lint:
    name: Lint (ruff)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no backend changes)
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend changes — skipping ruff lint."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.backend == 'true'
      - name: Install uv
        if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Ruff lint
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: uv run --frozen --group dev ruff check .

  unit:
    name: Unit tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no backend changes)
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend changes — skipping unit tests."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.backend == 'true'
      - name: Install uv
        if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Pure logic (Pydantic schema validation) — no database, no Docker.
      - name: Pytest (unit)
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: uv run --frozen --group dev pytest tests/unit -q

  integration:
    name: Integration tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no backend changes)
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend changes — skipping integration tests."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.backend == 'true'
      - name: Install uv
        if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Uses testcontainers to spin up real Postgres 17; the ubuntu-latest
      # runner has a running Docker daemon available.
      - name: Pytest (integration)
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: uv run --frozen --group dev pytest tests/integration -q

  client:
    name: Pandan client (lint + tests)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no pandan-client changes)
        if: needs.changes.outputs.client != 'true'
        run: echo "No pandan-client changes — skipping client lint + tests."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.client == 'true'
      - name: Install uv
        if: needs.changes.outputs.client == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Shared httpx wrapper (KAN-21) — every method is exercised against a
      # mocked httpx transport, so no backend or database is needed.
      - name: Ruff lint
        if: needs.changes.outputs.client == 'true'
        working-directory: pandan-client
        run: uv run --frozen --group dev ruff check .
      - name: Pytest
        if: needs.changes.outputs.client == 'true'
        working-directory: pandan-client
        run: uv run --frozen --group dev pytest -q

  mcp:
    name: MCP server (lint + tests)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no mcp changes)
        if: needs.changes.outputs.mcp != 'true'
        run: echo "No mcp changes — skipping MCP server lint + tests."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.mcp == 'true'
      - name: Install uv
        if: needs.changes.outputs.mcp == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Pure logic — the API client is exercised against a mocked httpx
      # transport, so no backend or database is needed.
      - name: Ruff lint
        if: needs.changes.outputs.mcp == 'true'
        working-directory: mcp
        run: uv run --frozen --group dev ruff check .
      - name: Pytest
        if: needs.changes.outputs.mcp == 'true'
        working-directory: mcp
        run: uv run --frozen --group dev pytest -q

  cli:
    name: CLI (lint + tests)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no pandan-cli changes)
        if: needs.changes.outputs.cli != 'true'
        run: echo "No pandan-cli changes — skipping CLI lint + tests."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.cli == 'true'
      - name: Install uv
        if: needs.changes.outputs.cli == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Pure logic — the shared client is exercised against a mocked httpx
      # transport, so no backend or database is needed.
      - name: Ruff lint
        if: needs.changes.outputs.cli == 'true'
        working-directory: pandan-cli
        run: uv run --frozen --group dev ruff check .
      - name: Pytest
        if: needs.changes.outputs.cli == 'true'
        working-directory: pandan-cli
        run: uv run --frozen --group dev pytest -q
      # Bump-on-fix (V50, KAN-435). Lives in CI as well as the pre-push hook
      # because the hook is opt-in (a symlink per clone) and bypassable with
      # --no-verify, and this rule is exactly the kind that gets bypassed "just
      # this once" — which is how 0.3.0 shipped twice with different behaviour.
      # Uses the `changes` job's paths-filter outputs rather than git plumbing, so
      # it needs no deepened checkout and works on both pull_request and push.
      - name: CLI version bump
        if: needs.changes.outputs.cli_code == 'true'
        run: |
          if [ "${{ needs.changes.outputs.cli_version }}" != "true" ]; then
            echo "::error::pandan-cli/pandan_cli/ changed but the CLI version did not. Bump __version__ in pandan-cli/pandan_cli/__init__.py AND version in pandan-cli/pyproject.toml (then re-run \`uv lock\`) in this same PR — otherwise \`pandan --version\` cannot distinguish a stale build from current source (V50, KAN-435)."
            exit 1
          fi
          echo "CLI behaviour changed and the version was bumped — OK."

  frontend:
    name: Frontend build & type-check
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no frontend changes)
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend changes — skipping frontend build & type-check."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.frontend == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci
      - name: Type-check (svelte-check)
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run check
      - name: Build
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: changes
    runs-on: ubuntu-latest
    # A long-running Postgres the backend connects to. Unlike the integration
    # job (testcontainers, in-process), the e2e backend is a separate uvicorn
    # process, so it needs a standalone DB — a service container fits.
    #
    # e2e exercises the full stack, so its heavy steps run when EITHER the
    # backend OR the frontend changed. Service containers are declared
    # statically and can't be gated on a step `if:`, but an idle Postgres
    # container on a docs-only run is cheap and the job still finishes fast.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The Playwright webServer boots `uv run uvicorn ...`, which inherits this.
      DATABASE_URL: postgresql+psycopg://kanban:kanban@localhost:5432/kanban
    steps:
      - name: Skip (no backend/frontend changes)
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.frontend != 'true'
        run: echo "No backend or frontend changes — skipping e2e."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'

      # Backend toolchain (Playwright's webServer runs migrations + uvicorn).
      - name: Install uv
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync backend deps
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        working-directory: backend
        run: uv sync --frozen

      # Frontend toolchain (Vite dev server + Playwright).
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      # Cache the downloaded browser (~120 MB) keyed on the Playwright version,
      # so it is only re-downloaded when @playwright/test is bumped.
      - name: Resolve Playwright version
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      # On a cache miss install the browser + its OS libs; on a hit the browser
      # is restored, so only the (uncacheable, system-level) OS libs are needed.
      - name: Install Chromium + OS deps
        if: (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install Chromium OS deps only
        if: (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      # Playwright boots the backend (:8000) + Vite (:5173) itself and drives
      # Chromium against them. reuseExistingServer is false under CI.
      - name: Run e2e
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Build the container images (KAN-584). Before this job, `.github/workflows/`
  # contained no reference to `Dockerfile` anywhere: a Dockerfile-only PR matched
  # no filter, all 13 checks reported success having run nothing (PR #248: `Lint
  # (ruff)` -> "Skip (no backend changes)" in 3s, same for Unit/Integration/
  # Frontend), and deploy.yml then shipped it to production. This is the fifth
  # "guard with no watcher" in this repo and the only one that was not a guard
  # failing to run — it was a build input with no guard at all.
  #
  # WHAT THIS JOB PROVES, EXACTLY. That the Dockerfile plus this commit's build
  # context still resolve, that every stage succeeds, and that the resulting
  # image is USABLE — not merely that `docker build` exited 0. It is NOT the
  # image that ships: `flyctl deploy --remote-only` rebuilds on Fly's builder
  # minutes later, and this Dockerfile's bases float (`node:22-slim`,
  # `python:3.12-slim`, `ghcr.io/astral-sh/uv:0.12` — see the BUILD INPUTS block
  # at the top of ./Dockerfile), so the two builds can legitimately differ. The
  # claim is about the RECIPE, not the bytes. Saying otherwise would be the
  # failure this job is supposed to prevent: a build job that builds something,
  # but not the thing that ships, and is trusted as if it did.
  #
  # WHAT IT DOES NOT COVER — stated because a silent gap in a guard's trigger is
  # this project's most repeated defect:
  #   * Ordinary source under backend/ and frontend/. The filter is the build
  #     recipe + the dependency manifests only, so a source-only PR does NOT
  #     build an image. Accepted: the image runs no compile over app source, and
  #     the two build steps it does run are already run by other jobs
  #     (`npm run build` by `frontend`, `uv sync --frozen` by lint/unit/
  #     integration). A source edit that breaks ONLY the image build therefore
  #     still reaches prod unbuilt. Widening the filter to `backend/** +
  #     frontend/**` closes that at the price of a docker build on nearly every
  #     PR; that trade was declined, not overlooked.
  #   * fly.toml's CONTENTS. It is in the filter (a fly.toml change always
  #     deploys) but `docker build` never reads it — nothing here validates a
  #     malformed fly.toml.
  #   * The Fly-side build. See above.
  #   * Runtime behaviour needing a database. The image asserts import + static
  #     bundle; `alembic upgrade head` and a real request are prod-verification.
  #
  # COST. The app image is the most expensive thing in this workflow: a cold
  # `npm ci` + vite build + `uv sync` with no layer cache, ~25s on a 20-core dev
  # box and a few minutes on a 2-core runner. That is the argument for the tight
  # filter above — on the common PR shape this job skips in seconds like every
  # other. No `type=gha` layer cache on purpose: the filter makes runs rare
  # enough that the cache would usually be cold or stale, and a stale cache on a
  # job whose entire point is "the inputs still resolve" is worse than no cache.
  image:
    name: Container images (docker build)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no image build inputs changed)
        if: needs.changes.outputs.image != 'true' && needs.changes.outputs.mcp_image != 'true'
        run: echo "No container-image build inputs changed — skipping the image builds."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.image == 'true' || needs.changes.outputs.mcp_image == 'true'

      # --- the app image (./Dockerfile) — the one Fly deploys ---------------
      - name: Build the app image
        if: needs.changes.outputs.image == 'true'
        run: docker build -f Dockerfile -t pandan-app:ci .

      # "It built" is a weak claim: the frontend stage can emit an empty dist and
      # the build still exits 0, and `uv sync --no-dev` here vs `--group dev`
      # everywhere else means a runtime dependency misfiled into the dev group
      # passes every other job in this workflow and only fails in this image. So
      # assert the image is usable, in one `docker run`.
      - name: Assert the app image is usable, not merely built
        if: needs.changes.outputs.image == 'true'
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint /app/.venv/bin/python pandan-app:ci - <<'PY'
          import pathlib
          import app.main as m

          static = pathlib.Path("/app/static")
          assert (static / "index.html").is_file(), "no /app/static/index.html — the SPA bundle did not land in the image"
          assets = sorted(p.name for p in (static / "assets").iterdir())
          assert assets, "/app/static/assets is empty — vite produced no bundle"
          print(f"static bundle OK: index.html + {len(assets)} asset(s), e.g. {assets[0]}")

          paths = {getattr(r, "path", None) for r in m.app.routes}
          assert "/{full_path:path}" in paths, "SPA fallback not registered — main.py did not see STATIC_DIR at /app/static"
          assert "/api/health" in paths, "the API router is not mounted"
          print(f"app.main imported OK under --no-dev: {len(paths)} distinct route paths, SPA fallback + /api/health present")
          PY
      # The Dockerfile CMD is `alembic upgrade head && uvicorn ...`, resolved off
      # PATH=/app/.venv/bin. Both are runtime deps that only this image installs
      # without the dev group, and a missing one crash-loops the machine on boot.
      - name: Assert the CMD's binaries exist
        if: needs.changes.outputs.image == 'true'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh pandan-app:ci -c 'set -eu; alembic --version; uvicorn --version'

      # --- the MCP image (mcp/Dockerfile) -----------------------------------
      # Same hole, different workflow: publish-mcp-image.yml is the only place in
      # this repo that builds this image and it runs on `v*` tags only, so an
      # mcp/Dockerfile change is unvalidated until someone cuts a release and it
      # fails there. Cheap enough (~10s locally) to just build it here too.
      - name: Build the MCP image
        if: needs.changes.outputs.mcp_image == 'true'
        # Context is the REPO ROOT, not mcp/: mcp/Dockerfile COPYs the sibling
        # pandan-client/ path dep. Mirrors publish-mcp-image.yml's `context: .`.
        run: docker build -f mcp/Dockerfile -t pandan-mcp:ci .

      # No tool-count assertion here on purpose — the 49-tool freeze lives in
      # mcp/tests/test_schema.py and must have exactly one home. This asserts
      # only that the installed server enumerates its tools at all, which is what
      # an image smoke test can say that the test suite cannot.
      - name: Assert the MCP image is usable, not merely built
        if: needs.changes.outputs.mcp_image == 'true'
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint python pandan-mcp:ci - <<'PY'
          import asyncio

          from pandan_mcp.server import mcp

          tools = asyncio.run(mcp.list_tools())
          assert tools, "the MCP server in the image enumerates no tools"
          print(f"MCP image OK: {len(tools)} tools, e.g. {tools[0].name}")
          PY

  # Supply-chain hardening (dev-playbook principles 12 & 13): a secret scan over
  # the full git history plus a dependency vulnerability audit of every project.
  #
  # This job deliberately has NO `needs: changes` gate and NO job-level `if:` —
  # it ALWAYS runs and reports on every push/PR, because a leaked secret or a new
  # CVE can surface from a "docs-only" change (a pasted key in a Markdown file, an
  # advisory published against an already-locked dependency). It is fast enough
  # (secret scan ~1s over ~120 commits; audits hit only locked versions) to run
  # unconditionally.
  #
  # NOT a required status check. Branch protection lists the other jobs as
  # required; wiring `Security scan` in as a required check needs a maintainer
  # branch-protection settings change (same class of change as the aggressor
  # `CI Success` aggregator noted at the top of this file) and is left as a
  # documented follow-up. Until then this reports for visibility but does not
  # block merge — so a newly-published CVE surfaces without hard-stopping every
  # unrelated PR.
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — gitleaks scans the whole history, not just the tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --- Secret scan (gitleaks) -------------------------------------------
      # Run the pinned official image directly rather than gitleaks/gitleaks-action
      # to sidestep its org-account license gate (GITLEAKS_LICENSE) and stay fully
      # deterministic. Exits non-zero if any secret is found in the working tree
      # or history. If this ever fails on a REAL secret, the fix is to ROTATE the
      # secret and rewrite history — never to add an allowlist to force CI green.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --no-banner --redact --verbose

      # --- Dependency toolchains --------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --- Python dependency audit (pip-audit) ------------------------------
      # Audit the locked deps of every uv project against the PyPI advisory DB.
      # `--no-emit-project` drops the project itself; `--no-emit-package
      # pandan-client` drops the local path dependency (an editable requirement
      # pip-audit can't resolve — pandan-client is audited as its own project);
      # `--no-hashes` because pip-audit only needs versions, not integrity hashes.
      # Threshold: pip-audit fails the step on ANY known vulnerability. That is
      # intentionally strict — the lockfiles are currently clean, and because this
      # job is non-required a finding surfaces loudly without blocking merge. If
      # it becomes noisy with unfixable/low-severity advisories, scope it (e.g.
      # `--vulnerability-service osv`, or gate on fixable/high) rather than muting.
      - name: Python dependency audit (pip-audit)
        run: |
          set -euo pipefail
          for d in backend mcp pandan-client pandan-cli; do
            echo "::group::pip-audit $d"
            ( cd "$d" && uv export --frozen --no-emit-project \
                --no-emit-package pandan-client --no-hashes \
                --format requirements-txt > /tmp/req.txt )
            uvx pip-audit -r /tmp/req.txt
            echo "::endgroup::"
          done

      # --- Frontend dependency audit (npm audit) ----------------------------
      # Reads package-lock.json directly (no `npm ci` needed). Threshold: fail
      # only on high/critical to avoid transitive-dev-dep noise blocking PRs.
      - name: Frontend dependency audit (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
