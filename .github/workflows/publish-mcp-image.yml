name: Publish MCP image

# Build the MCP server (mcp/) as an OCI image and push it to the GitHub
# Container Registry (ghcr.io) so agents can `docker run` it with no local
# Python/uv (KAN-47). The image bundles the sibling `pandan-client` path dep, so
# the build CONTEXT is the REPO ROOT with `-f mcp/Dockerfile` (see mcp/Dockerfile).
#
# BUILD PROVENANCE (KAN-452): the image carries OCI labels
# (org.opencontainers.image.revision/.version/.created, emitted by
# docker/metadata-action) AND a gate that fails the release if the built image
# doesn't name this commit — the container mirror of release-cli.yml's
# `--version` smoke test. See mcp/scripts/assert-image-provenance.sh.
#
# BUILD-INPUT PROVENANCE (KAN-475): "which commit?" is not "which toolchain?".
# The Dockerfile's inputs float, so this workflow resolves them to immutable
# digests, builds against those, and records them as labels the same gate then
# asserts. The image is NOT byte-reproducible from the commit alone — it is
# auditable: it says exactly which interpreter and uv it got. See the KAN-475
# section of mcp/README.md for the scope statement and the rebuild recipe.
#
# TRIGGER: version tags only (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
# Never runs on a PR or a branch push — publishing is a deliberate, tag-gated ops
# action (mirrors the repo's tag convention; v0.1.0 already exists).
on:
  push:
    tags:
      - 'v*'

env:
  # ghcr.io/<owner>/pandan-mcp — owner comes from the repo so a fork
  # publishes under its own namespace without edits.
  IMAGE: ghcr.io/${{ github.repository_owner }}/pandan-mcp

jobs:
  publish:
    name: Build & push to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io with the built-in token
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Full semver (v1.2.3 -> 1.2.3, 1.2, 1), plus `latest` on the newest.
          #
          # `latest` is KEPT deliberately (KAN-452 revisited it): it is the
          # zero-friction "try the MCP server" pull and every existing .mcp.json
          # points at it. What made a floating tag dangerous was that the image
          # could not say which commit it was — the OCI labels below plus the
          # gate further down fix exactly that, so `:latest` is now
          # self-identifying (`docker inspect` answers "which build is this?").
          # The docs demote it to the try-it-out tag and recommend a semver tag
          # or a digest for anything long-lived; see mcp/README.md.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # BUILD-INPUT PROVENANCE (KAN-475). mcp/Dockerfile's inputs float by design
      # (`python:3.12-slim`, `ghcr.io/astral-sh/uv:latest`) so a plain local
      # `docker build` needs no arguments. Floating inputs mean two builds of the
      # SAME commit can embed a different interpreter and a different uv, which
      # makes the `.revision` label above true but weaker than it looks — the gate
      # only compares label values, so it cannot see a toolchain difference.
      #
      # Resolve each tag to its immutable index digest ONCE here, then feed the
      # result to every build below as a build-arg AND record it as a label. Two
      # things follow: the release's builds are input-identical (which also closes
      # the "two separate invocations" caveat noted below — they can no longer
      # resolve different base images), and the published image self-reports the
      # exact toolchain it got, so two same-revision images are distinguishable.
      #
      # We resolve here rather than committing digest pins to the Dockerfile
      # because a committed pin would have NO WATCHER: Dependabot's docker
      # ecosystem ignores `COPY --from` refs entirely
      # (dependabot/dependabot-core#5103, open since 2022), so the uv pin could
      # never be bumped automatically. See the KAN-475 note in mcp/README.md.
      #
      # `imagetools inspect --format` is not honoured by the buildx in the runner
      # image (v0.31.x prints its default report and ignores the flag), so parse
      # the `Digest:` line — that is the multi-arch index digest, which is the
      # right one to pin (it preserves multi-arch resolution).
      - name: Resolve the floating build inputs to digests
        id: inputs
        run: |
          set -euo pipefail
          resolve() {
            local ref="$1" repo digest
            repo="${ref%:*}"
            digest="$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ {print $2; exit}')"
            case "$digest" in
              sha256:*) : ;;
              *) echo "::error::could not resolve '$ref' to a digest (got '$digest')"; exit 1 ;;
            esac
            printf '%s@%s' "$repo" "$digest"
          }
          python_base="$(resolve python:3.12-slim)"
          uv_source="$(resolve ghcr.io/astral-sh/uv:latest)"
          echo "Resolved build inputs for this release:"
          echo "  python base: $python_base"
          echo "  uv source:   $uv_source"
          {
            echo "python_base=$python_base"
            echo "uv_source=$uv_source"
          } >> "$GITHUB_OUTPUT"
          {
            echo "toolchain_labels<<EOF"
            echo "io.github.leejianrong.pandan.build.python=$python_base"
            echo "io.github.leejianrong.pandan.build.uv=$uv_source"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # BUILD TWICE, ON PURPOSE (KAN-452). The provenance gate must run BEFORE
      # anything reaches ghcr.io — mirroring release-cli.yml, where the
      # `--version` smoke test runs before "Attach binary to the Release" — so
      # an image that cannot identify itself is never published. `push` and
      # `load` can't be combined, hence: build once into the local docker daemon
      # and assert on it, then build again with `push: true`. The second build
      # is a full cache hit on the same buildx builder (plus the gha cache
      # written below), so it only pushes layers; it is not a second compile.
      # (Honest limitation: the two builds are separate invocations, so a cache
      # miss could in principle produce different *bytes*. It cannot produce
      # different *provenance* — both are handed the same `steps.meta.outputs.labels`
      # — and the labels are what the gate asserts, so the claim stays true.
      # Since KAN-475 both are also handed the same resolved base-image DIGESTS,
      # so they can no longer differ in interpreter or uv either.)
      - name: Build for the provenance gate (local, not pushed)
        uses: docker/build-push-action@v7
        with:
          # Build context is the repo root; the Dockerfile COPYs both mcp/ and
          # the sibling pandan-client/, so it MUST NOT be the mcp/ subdir.
          context: .
          file: mcp/Dockerfile
          load: true
          tags: pandan-mcp:provenance-gate
          build-args: |
            PYTHON_BASE=${{ steps.inputs.outputs.python_base }}
            UV_SOURCE=${{ steps.inputs.outputs.uv_source }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.inputs.outputs.toolchain_labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container-native mirror of the CLI's `--version` release smoke test:
      # assert the built image carries org.opencontainers.image.revision equal to
      # THIS commit (plus .version and .created). Fails the release if not. The
      # script echoes every label and every assertion, so the run log is positive
      # evidence the gate actually fired — a green run with no such log means the
      # step didn't run and should be treated as a red flag.
      - name: Gate — image carries this release's build provenance
        run: |
          mcp/scripts/assert-image-provenance.sh \
            pandan-mcp:provenance-gate \
            "$GITHUB_SHA" \
            "${GITHUB_REF_NAME#v}"

      - name: Build & push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PYTHON_BASE=${{ steps.inputs.outputs.python_base }}
            UV_SOURCE=${{ steps.inputs.outputs.uv_source }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.inputs.outputs.toolchain_labels }}
          cache-from: type=gha

      # Print the immutable reference a consumer should pin, so the release log
      # itself answers "what exactly did we publish?" without a registry round
      # trip (mcp/README.md documents pulling by digest).
      - name: Report the published digest
        run: |
          echo "Published ${{ env.IMAGE }} for commit $GITHUB_SHA"
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "Pin this exact build with:"
          echo "  docker pull ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
          {
            echo "### MCP image published"
            echo ""
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- pin: \`${{ env.IMAGE }}@${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "Build inputs (KAN-475) — pass these back as build-args to rebuild"
            echo "this image from the same toolchain:"
            echo ""
            echo "- python base: \`${{ steps.inputs.outputs.python_base }}\`"
            echo "- uv source: \`${{ steps.inputs.outputs.uv_source }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
