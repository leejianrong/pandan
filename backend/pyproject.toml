[project]
name = "pandan-backend"
version = "0.1.0"
description = "Pandan MVP backend — FastAPI + sync SQLAlchemy 2.0 + psycopg v3"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.14",
    "pydantic>=2.10",
    # Human auth foundation (Milestone 3 V6, ADR 0011). fastapi-users' user store
    # is async-only, so this pulls in the SQLAlchemy async stack (greenlet) used by
    # a second, async engine alongside the sync one (ADR 0008 preserved).
    "fastapi-users[sqlalchemy,oauth]>=15.0.5",
    "greenlet>=3.5.4",
    # Error tracking (KAN-172, ADR 0017). Only activated when SENTRY_DSN is set —
    # a no-op otherwise — so dev + tests never report. Installed so prod can opt in
    # via a Fly secret with no code change; its FastAPI/Starlette integration is
    # auto-enabled by sentry_sdk.init().
    "sentry-sdk[fastapi]>=2.66.1",
    # Application rate limiting (V27, KAN-291). In-memory storage (single machine,
    # resets on cold-start — acceptable MVP). Driven from a single classifying
    # middleware (app/ratelimit.py) over slowapi's bundled `limits` engine, since
    # the sensitive login/OAuth-callback routes are generated by fastapi-users and
    # can't take a per-route slowapi decorator.
    "slowapi>=0.1.9",
    "regex>=2026.9.3",
    # OAuth Client ID Metadata Document fetches (KAN-1734, ADR 0025): resolving a
    # CIMD `client_id` (an HTTPS URL) means the backend itself makes an outbound
    # HTTP call at runtime — previously httpx was only a dev-group test-client
    # dependency here. See app/oauth_client.py.
    "httpx>=0.28",
    # Hosted Streamable HTTP MCP transport (KAN-1732, ADR 0025): the backend
    # mounts the exact same tool registry the stdio `pandan-mcp` server exposes
    # (`backend/app/mcp_host.py` wraps `pandan_mcp.server.mcp.streamable_http_app()`
    # in our own bearer-auth middleware), depending on it by path — the same
    # sibling-package pattern KAN-21 already uses for `mcp/`'s own `pandan-client`
    # dependency (see `[tool.uv.sources]` below) — so both transports can never
    # drift into two implementations of the same 57 tools.
    "pandan-mcp",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # httpx moved to the main [project.dependencies] list above (KAN-1734) — it's
    # a runtime dependency now, not just the test client's.
    "testcontainers[postgres]>=4.15.0",
    "ruff>=0.16.0",
]

[tool.uv]
package = false

[tool.uv.sources]
pandan-mcp = { path = "../mcp", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the backend root (where the `app` package lives) on sys.path so tests in
# tests/unit and tests/integration can `import app.*` regardless of CWD.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated Alembic migrations follow their own template conventions.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, and import sorting.
select = ["E", "F", "I"]
